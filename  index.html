<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Face Game</title>
<style>
  :root { --bg:#2d5a27; --text:#f4f8ef; --panel:rgba(20,40,17,.92); --accent:#f2c94c; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1f3f1b; } }
  :root[data-theme="dark"] { --bg:#1f3f1b; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  html, body { height:100%; margin:0; }
  body { overflow:hidden; background:var(--bg); font-family:Georgia,"Times New Roman",serif; touch-action:none; user-select:none; -webkit-user-select:none; color:var(--text); }
  body.playing { cursor:none; }
  #insect { position:absolute; width:90px; height:auto; pointer-events:none; transform:translate(-50%,-50%); z-index:2; display:none; }
  body.playing #insect { display:block; }
  .food { position:absolute; font-size:32px; transform:translate(-50%,-50%); }
  #hud { position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); left:20px; right:20px; display:flex; justify-content:space-between; align-items:center; font-size:24px; z-index:3; pointer-events:none; }
  #song { pointer-events:auto; cursor:pointer; padding:6px 12px; font-size:16px; color:var(--text); background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.5); border-radius:8px; text-decoration:none; }
  #credit { position:fixed; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom,0px)); text-align:center; font-size:20px; z-index:3; pointer-events:none; }
  .overlay { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.45); padding:16px; box-sizing:border-box; }
  .overlay.hidden { display:none; }
  .card { width:100%; max-width:380px; max-height:100%; overflow-y:auto; background:var(--panel); border-radius:14px; padding:22px; box-sizing:border-box; text-align:center; touch-action:pan-y; }
  h1 { margin:0 0 6px; font-size:30px; }
  p { margin:0 0 14px; opacity:.85; line-height:1.4; }
  input { width:100%; box-sizing:border-box; font:inherit; font-size:18px; padding:12px; border-radius:8px; border:2px solid rgba(255,255,255,.4); background:rgba(255,255,255,.1); color:var(--text); text-align:center; user-select:text; -webkit-user-select:text; }
  input:focus-visible, button:focus-visible, #song:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  button.go { width:100%; margin-top:12px; font:inherit; font-size:20px; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#1b2a17; cursor:pointer; }
  ol { list-style:none; margin:16px 0 0; padding:0; text-align:left; }
  li { display:flex; justify-content:space-between; gap:10px; padding:6px 4px; border-top:1px solid rgba(255,255,255,.18); font-size:18px; }
  li.me { color:var(--accent); }
  #board h2 { margin:18px 0 0; font-size:18px; }
  .note { font-size:14px; opacity:.7; margin-top:10px; }
</style>
</head>

<div id="hud"><span id="score">Score: 0</span><span id="timer">30</span><a id="song" href="https://youtu.be/XApRBIcDYu8?si=MnfsXnJmINtQF16f" target="_blank" rel="noopener">Play song</a></div>
<div id="credit">eng mahmoud shehata</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1 id="title">Face Game</h1>
    <p id="msg">Enter your name, then collect as much food as you can in 30 seconds. Drag with your mouse or finger.</p>
    <input id="name" maxlength="16" placeholder="Your name" autocomplete="off" aria-label="Your name">
    <button class="go" id="start">Start</button>
    <div id="board" hidden><h2>Leaderboard</h2><ol id="list"></ol></div>
    <div class="note" id="note"></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const insect = $("insect"), scoreEl = $("score"), timerEl = $("timer"), menu = $("menu"),
        nameEl = $("name"), listEl = $("list");
  const ROUND = 30, emojis = ["🍎","🍃","🍯","🌸"];
  let x = innerWidth/2, y = innerHeight/2, tx = x, ty = y, score = 0, left = ROUND;
  let playing = false, player = "", offset = 0, foods = [], timer = null, db = null, rows = [];

  try { nameEl.value = localStorage.getItem("faceGameName") || ""; } catch (e) {}

  function move(e) {
    tx = e.clientX;
    offset = e.pointerType === "touch" ? 60 : 0;
    ty = e.clientY - offset;
  }
  addEventListener("pointermove", move);
  addEventListener("pointerdown", move);

  function spawn() {
    const el = document.createElement("div");
    el.className = "food";
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const fx = 40 + Math.random()*(innerWidth-80), fy = 90 + Math.random()*(innerHeight-170);
    el.style.left = fx+"px"; el.style.top = fy+"px";
    document.body.appendChild(el);
    foods.push({el, x:fx, y:fy});
  }

  function hash(s) { let h = 5381; for (const c of s) h = ((h*33) ^ c.codePointAt(0)) >>> 0; return "p" + h.toString(36); }

  function renderBoard() {
    const board = $("board");
    board.hidden = !db;
    listEl.textContent = "";
    if (!db) return;
    if (!rows.length) { const li = document.createElement("li"); li.textContent = "No scores yet. Be the first."; listEl.appendChild(li); return; }
    rows.forEach((r, i) => {
      const li = document.createElement("li");
      if (player && r.name.toLowerCase() === player.toLowerCase()) li.className = "me";
      const a = document.createElement("span"), b = document.createElement("span");
      a.textContent = (i+1) + ". " + r.name; b.textContent = r.best;
      li.append(a, b); listEl.appendChild(li);
    });
  }

  async function initDb() {
    try {
      if (!window.claude) return;
      db = await claude.use("db");
      if (!db) { $("note").textContent = "Leaderboard is not available here. Scores stay on this device."; return; }
      db.collection("scores").orderBy("best","desc").limit(8).onSnapshot((snap) => {
        rows = snap.docs.map(d => d.data()).filter(d => d && typeof d.best === "number");
        renderBoard();
      }, () => {});
      renderBoard();
    } catch (e) { db = null; }
  }

  async function saveScore() {
    if (!db || !player) return;
    try {
      const ref = db.doc("scores/" + hash(player.toLowerCase()));
      const snap = await ref.get();
      const prev = snap.exists ? snap.data().best : -1;
      if (score > prev) await ref.set({name: player, best: score, at: Date.now()});
    } catch (e) {}
  }

  function startGame() {
    const n = nameEl.value.trim();
    if (!n) { nameEl.focus(); nameEl.style.borderColor = "#f2c94c"; return; }
    player = n;
    try { localStorage.setItem("faceGameName", n); } catch (e) {}
    foods.forEach(f => f.el.remove()); foods = [];
    score = 0; left = ROUND;
    scoreEl.textContent = player + ": 0"; timerEl.textContent = left;
    for (let i = 0; i < 5; i++) spawn();
    menu.classList.add("hidden");
    document.body.classList.add("playing");
    playing = true;
    clearInterval(timer);
    timer = setInterval(() => {
      left--; timerEl.textContent = left;
      if (left <= 0) endGame();
    }, 1000);
  }

  async function endGame() {
    clearInterval(timer); playing = false;
    document.body.classList.remove("playing");
    foods.forEach(f => f.el.remove()); foods = [];
    $("title").textContent = "Time's up, " + player + "!";
    $("msg").textContent = "You scored " + score + ". Beat the leaderboard or challenge a friend to beat you.";
    $("start").textContent = "Play again";
    menu.classList.remove("hidden");
    await saveScore();
  }

  $("start").addEventListener("click", startGame);
  nameEl.addEventListener("keydown", (e) => { if (e.key === "Enter") startGame(); });

  function update() {
    const dx = tx - x, dy = ty - y;
    x += dx*0.15; y += dy*0.15;
    insect.style.transform = "translate(-50%,-50%) rotate(" + Math.max(-25, Math.min(25, dx*0.15)) + "deg)";
    insect.style.left = x+"px"; insect.style.top = y+"px";
    if (playing) {
      for (let i = foods.length-1; i >= 0; i--) {
        const f = foods[i];
        if (Math.hypot(f.x-x, f.y-y) < 55) {
          f.el.remove(); foods.splice(i,1);
          scoreEl.textContent = player + ": " + (++score);
          spawn();
        }
      }
    }
    requestAnimationFrame(update);
  }
  update();
  initDb();
</script>
</body>
</html>
